<!DOCTYPE html>
<html>
<head>
    <title>SQL Injection Demo</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">SQL Injection Demonstration</h2>

    <form method="POST" class="card p-4">
        <label>Enter Username:</label>
        <input class="form-control" type="text" name="username" required>

        <label class="mt-3">Query Mode:</label>
        <select class="form-select" name="mode">
            <option value="vulnerable">Vulnerable Mode (Unsafe)</option>
            <option value="safe">Safe Mode (Secure Parameterized)</option>
        </select>

        <button class="btn btn-primary mt-3">Run Query</button>
    </form>

    {% if query %}
    <div class="card p-4 mt-4">
        <h5>Executed SQL Query:</h5>
        <pre>{{ query }}</pre>

        <h5>Result:</h5>
        {% if result %}
            <ul>
                {% for row in result %}
                <li>{{ row }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No results.</p>
        {% endif %}
    </div>
    {% endif %}

</div>

</body>
</html>
